[sources]
wiki_url = "https://wiki.gtnewhorizons.com/wiki/Main_Page"
git_url = "https://github.com/GTNewHorizons/GT-New-Horizons-Modpack/tree/master"
git_quests_path = "/config/betterquesting/DefaultQuests/Quests"

[paths]
wiki_dir = "data/wiki"
wiki_clean_dir = "data/wiki_clean"
quests_dir = "data/quests"
quests_clean_dir = "data/quests_clean"
quests_enriched_dir = "data/quests_enriched"
chunks_dir = "data/chunks"

[database]
backend = "postgres"
sqlite_path = "data/nesql.db"
pg_host = "localhost"
pg_port = 5432
pg_database = "gtnh-recepties"
pg_user = "postgres"
pg_password = "gthn"

[index]
model_name = "BAAI/bge-base-en-v1.5"
batch_size = 32
normalize_embeddings = true
chunk_files = ["wiki_chunks.jsonl", "quest_chunks.jsonl"]

[qdrant]
# Supported modes: "local" (embedded disk storage) or "server" (HTTP/gRPC URL)
mode = "server"
path = "qdrant"
url = "http://localhost:6333"
api_key = ""
collection_name = "gtnh_rag_v3-bge-base-en-v1.5"
distance = "cosine"
hnsw_m = 16
hnsw_ef_construct = 64

[search]
top_k = 10
hnsw_ef = 128
exact = false
score_threshold = 0.35
query_instruction = ""
